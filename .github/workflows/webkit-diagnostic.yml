name: Diagnose WebKit startup on the verified build
on:
  push:
    branches: [fix/webkit-startup]
permissions:
  contents: read
  actions: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: kikori-web
          path: build/web/
          run-id: 38375106370
          github-token: ${{ github.token }}
      - name: Install browser
        run: |
          pip install playwright==1.56.0
          python3 -m playwright install --with-deps webkit
      - name: Inspect the actual startup and rendered movement
        run: xvfb-run -a python3 tests/browser_smoke.py --engine webkit --probe
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-startup-diagnostic
          path: reports/
