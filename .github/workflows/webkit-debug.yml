name: Diagnose WebKit startup
on:
  push:
    branches: [fix/webkit-logistics-startup]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/kikori-godot-tools
          key: godot-4.5.2-linux-web-sha256-v1
      - run: python3 tools/install_godot.py
      - run: |
          mkdir -p build/debug
          /tmp/kikori-godot-tools/godot --headless --path . --editor --import --quit
          /tmp/kikori-godot-tools/godot --headless --path . --export-debug Web build/debug/index.html
          cp web/framebuffer_guard.js build/debug/framebuffer_guard.js
      - run: |
          pip install playwright==1.56.0
          python3 -m playwright install --with-deps webkit
      - run: xvfb-run -a python3 tests/boot_stress.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
